<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>KaiserComponent Demo</title>
  </head>
  <body>
    <h1>KaiserComponent Demo</h1>
    <p>
      This page demonstrates embedding a prepackaged Lit component
      produced by this project. Any website can embed the same component
      by loading <code>dist/kaiser-component.js</code> and using the
      <code>&lt;kaiser-greeting&gt;</code> tag below.
    </p>
    <kaiser-greeting name="Kaiser"></kaiser-greeting>
    <flickr-mosaic width="100%" height="370.24px" columns="10" gap="10px"></flickr-mosaic>
    <custom-pdf-reader continuous width="100%" height="849px" pdf-url="https://firebasestorage.googleapis.com/v0/b/abu-ga-2024-1bec1.appspot.com/o/GA2026%2Fpdf%2FABU%20GA2026%20Agenda%20-%201-2%20November%202026%20Colombo-ac5884cf-ae25-40fd-a515-f8346b6671ca.pdf?alt=media&token=9d830d34-58a2-4270-a0b1-545776e95392"></custom-pdf-reader>
    <script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js'); }</script>
  </body>
</html>
